<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lista di Natale 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="snow snow-one" aria-hidden="true"></div>
  <div class="snow snow-two" aria-hidden="true"></div>
  <div class="glow glow-left" aria-hidden="true"></div>
  <div class="glow glow-right" aria-hidden="true"></div>

  <header>
    <div class="wrap hero-content">
      <span class="season-label">🎄 NATALE 2026</span>
      <h1>La mia lista di Natale</h1>
      <p>Idee regalo</p>
    </div>
  </header>

  <main class="wrap">
    <section id="choice" class="panel entrance-card">
      <div class="ornament">✦</div>
      <h2>Come vuoi entrare?</h2>
      <p class="intro">Scegli la modalità per continuare.</p>
      <div class="entrance-actions">
        <button id="guest" class="primary big-button">🎁 Devo fare un regalo</button>
        <button id="owner" class="secondary-button big-button">✏️ Ho creato la lista</button>
      </div>
    </section>

    <section id="login" class="panel hidden">
      <h2>Accesso proprietario</h2>
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">
      <div class="login-actions">
        <button id="loginBtn" class="primary">Entra</button>
        <button class="back">Indietro</button>
      </div>
      <p id="err"></p>
    </section>

    <section id="app" class="hidden">
      <div class="bar">
        <div>
          <h2 id="mode"></h2>
          <small id="note"></small>
        </div>
        <div class="top-actions">
          <button id="add" class="primary hidden">＋ Aggiungi regalo</button>
          <button id="logout" class="logout-button">Esci</button>
        </div>
      </div>
      <div id="grid" class="grid"></div>
    </section>
  </main>

  <dialog id="edit">
    <form id="giftForm">
      <input id="giftId" type="hidden">
      <h2>Regalo</h2>
      <input id="title" placeholder="Nome regalo" required>
      <textarea id="description" placeholder="Descrizione"></textarea>
      <input id="price" type="number" step="0.01" min="0" placeholder="Prezzo €">
      <input id="url" type="url" placeholder="Link prodotto https://...">
      <input id="image" type="url" placeholder="Link immagine https://...">
      <div class="actions">
        <button type="button" data-close>Annulla</button>
        <button class="primary">Salva</button>
      </div>
    </form>
  </dialog>

  <dialog id="reserve">
    <form id="reserveForm">
      <input id="reserveId" type="hidden">
      <h2>Lo prendo io 🎁</h2>
      <p>Puoi lasciare il nome, ma è facoltativo.</p>
      <input id="reservedBy" placeholder="Il tuo nome (facoltativo)">
      <label><input id="showName" type="checkbox"> Mostra il mio nome agli altri</label>
      <div class="actions">
        <button type="button" data-close>Annulla</button>
        <button class="primary">Conferma</button>
      </div>
    </form>
  </dialog>

  <div id="toast"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
