<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lista di Natale 2026</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap"><span>🎄 NATALE 2026</span><h1>La mia lista di Natale</h1><p>Idee regalo con link e prezzo indicativo.</p></div></header><main class="wrap"><section id="choice" class="panel"><h2>Come vuoi entrare?</h2><button id="guest" class="primary">🎁 Devo fare un regalo</button><button id="owner">✏️ Ho creato la lista</button></section><section id="login" class="panel hidden"><h2>Accesso proprietario</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn" class="primary">Entra</button><button class="back">Indietro</button><p id="err"></p></section><section id="app" class="hidden"><div class="bar"><div><h2 id="mode"></h2><small id="note"></small></div><div><button id="add" class="primary hidden">+ Regalo</button><button id="logout">Esci</button></div></div><div id="grid" class="grid"></div></section></main><dialog id="edit"><form id="giftForm"><input id="giftId" type="hidden"><h2>Regalo</h2><input id="title" placeholder="Nome regalo" required><textarea id="description" placeholder="Descrizione"></textarea><input id="price" type="number" step="0.01" min="0" placeholder="Prezzo €"><input id="url" type="url" placeholder="Link prodotto https://..."><input id="image" type="url" placeholder="Link immagine https://..."><div class="actions"><button type="button" data-close>Annulla</button><button class="primary">Salva</button></div></form></dialog><dialog id="reserve"><form id="reserveForm"><input id="reserveId" type="hidden"><h2>Lo prendo io 🎁</h2><p>Puoi lasciare il nome, ma è facoltativo.</p><input id="reservedBy" placeholder="Il tuo nome (facoltativo)"><label><input id="showName" type="checkbox"> Mostra il mio nome agli altri</label><div class="actions"><button type="button" data-close>Annulla</button><button class="primary">Conferma</button></div></form></dialog><div id="toast"></div><script type="module" src="app.js"></script></body></html>
